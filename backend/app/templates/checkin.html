<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ratel · Attendance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-1: #f7fbff;
      --bg-2: #edf5ff;
      --bg-3: #e3eeff;
      --panel: rgba(255,255,255,0.9);
      --panel-strong: #ffffff;
      --border: rgba(15,79,157,0.14);
      --text: #0e2c52;
      --muted: #5d7ca2;
      --soft: #7d98b8;
      --primary: #0f4f9d;
      --primary-strong: #0a3a78;
      --primary-soft: rgba(15,79,157,0.1);
      --accent: #2f7de1;
      --success: #1f9d68;
      --success-soft: rgba(31,157,104,0.12);
      --warning: #d9901a;
      --warning-soft: rgba(217,144,26,0.14);
      --danger: #cc3d5a;
      --danger-soft: rgba(204,61,90,0.12);
      --shadow: 0 28px 60px rgba(12,54,110,0.14);
    }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2), var(--bg-3));
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 999px;
      padding: 12px 18px 12px 22px;
      margin: 0 auto 20px;
      box-shadow: 0 16px 30px rgba(15,79,157,0.22);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }
    .session-badge {
      background: var(--success-soft);
      border: 1px solid rgba(31,157,104,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .session-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      flex-shrink: 0;
    }
    .session-name { color: var(--success); font-size: 14px; font-weight: 600; }

    /* Known employee card */
    .known-employee {
      display: none;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      align-items: center;
      gap: 14px;
    }
    .known-employee.visible { display: flex; }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; flex-shrink: 0;
      color: white;
    }
    .known-name { font-size: 16px; font-weight: 700; }
    .known-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .not-me {
      margin-left: auto;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      color: var(--text); font-size: 17px; font-weight: 500;
      outline: none; margin-bottom: 20px;
      -webkit-appearance: none; letter-spacing: 1px;
    }
    input::placeholder { color: var(--soft); }
    input:focus {
      border-color: rgba(47,125,225,0.45);
      background: #fff;
    }
    button.primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white; border: none;
      border-radius: 14px; padding: 18px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.3px;
      -webkit-appearance: none; transition: opacity 0.2s;
    }
    button.primary:active { opacity: 0.85; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.checkout {
      background: linear-gradient(135deg, var(--warning), #bd7a12);
    }
    .error {
      background: var(--danger-soft);
      border: 1px solid rgba(204,61,90,0.2);
      border-radius: 12px;
      padding: 14px; color: var(--danger);
      font-size: 14px; text-align: center;
      margin-bottom: 16px; display: none;
    }
    #id-section { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align:center"><div class="logo">RATEL</div></div>
    <h1 id="page-title">Check In</h1>
    <p class="subtitle" id="page-subtitle">Scan detected — confirm your identity</p>

    <div class="session-badge">
      <div class="session-dot"></div>
      <span class="session-name">{{ session_name }}</span>
    </div>

    {% if shift %}
    <div style="margin-top: -16px; margin-bottom: 24px; text-align: center;">
      <span style="background: var(--primary-soft); color: var(--primary); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
        {{ shift.replace('_', ' ') }} SHIFT
      </span>
    </div>
    {% endif %}

    <!-- Known employee (device bound) -->
    <div class="known-employee" id="known-employee">
      <div class="avatar" id="known-avatar">?</div>
      <div>
        <div class="known-name" id="known-name"></div>
        <div class="known-sub" id="known-sub">Device recognized</div>
      </div>
      <button class="not-me" onclick="showIdInput()">Not me</button>
    </div>

    <!-- ID input (new employees or override) -->
    <div id="id-section">
      <label>Employee ID</label>
      <input
        type="text" id="employee-id"
        placeholder="e.g. EMP-001"
        autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false"
        oninput="onEmployeeIdInput()"
      />
    </div>

    <div class="error" id="error-msg"></div>

    <button class="primary" id="action-btn" onclick="submitScan()">
      Mark Attendance
    </button>
  </div>

  <script id="checkin-data" type="application/json">
    {{ {
      "qr_token": qr_token,
      "session_id": session_id,
      "is_known": known_employee is not none,
      "known_name": known_employee.full_name if known_employee else "",
      "known_id": known_employee.employee_id if known_employee else "",
      "check_status": check_status
    } | tojson }}
  </script>

  <script>
    const pageData = JSON.parse(
      document.getElementById("checkin-data").textContent
    );
    const QR_TOKEN = pageData.qr_token;
    const SESSION_ID = pageData.session_id;
    let IS_KNOWN = pageData.is_known;
    let KNOWN_NAME = pageData.known_name;
    let KNOWN_ID = pageData.known_id;
    let CHECK_STATUS = pageData.check_status; // "none", "checked_in", "checked_out"

    // Generate simple browser fingerprint
    function getFingerprint() {
      const data = [
        navigator.userAgent,
        screen.width + "x" + screen.height,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        navigator.language,
      ].join("|");
      // Simple hash
      let hash = 0;
      for (let i = 0; i < data.length; i++) {
        hash = ((hash << 5) - hash) + data.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash).toString(16);
    }

    async function tryResolveFingerprint() {
      if (IS_KNOWN) return;
      
      const fp = getFingerprint();
      try {
        const res = await fetch(`/api/v1/checkin/resolve-fingerprint?fingerprint=${fp}`);
        const data = await res.json();
        
        if (data.found) {
          IS_KNOWN = true;
          KNOWN_NAME = data.full_name;
          KNOWN_ID = data.employee_id;
          initPage();
          console.log("Consistency achieved: Resolved identity from device fingerprint.");
        }
      } catch (e) {
        console.warn("Fingerprint resolution failed", e);
      }
    }

    function applyCheckStatus(status, name) {
      const btn = document.getElementById("action-btn");
      if (status === "checked_in") {
        document.getElementById("page-title").textContent = "Check Out";
        document.getElementById("page-subtitle").textContent = "Ready to clock out?";
        btn.textContent = "Clock Out";
        btn.classList.add("checkout");
        CHECK_STATUS = "checked_in";
      } else {
        document.getElementById("page-title").textContent = "Check In";
        document.getElementById("page-subtitle").textContent = "Scan detected — confirm your identity";
        btn.textContent = "Clock In";
        btn.classList.remove("checkout");
        CHECK_STATUS = status;
      }
    }

    function initPage() {
      if (IS_KNOWN) {
        document.getElementById("known-employee").classList.add("visible");
        document.getElementById("known-avatar").textContent =
          KNOWN_NAME.charAt(0).toUpperCase();
        document.getElementById("known-name").textContent = KNOWN_NAME;
        document.getElementById("id-section").style.display = "none";

        const sub = CHECK_STATUS === "checked_in" ? "Currently checked in" : "Device recognized";
        document.getElementById("known-sub").textContent = sub;
        applyCheckStatus(CHECK_STATUS, KNOWN_NAME);
      }
    }

    function clearDeviceCookie() {
      document.cookie = "ratel_device=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; samesite=None; secure";
    }

    function showIdInput() {
      clearDeviceCookie();
      IS_KNOWN = false;
      document.getElementById("known-employee").classList.remove("visible");
      document.getElementById("id-section").style.display = "block";
      // Reset to neutral state until employee ID is resolved
      document.getElementById("page-title").textContent = "Mark Attendance";
      document.getElementById("page-subtitle").textContent = "Enter your Employee ID";
      document.getElementById("action-btn").textContent = "Mark Attendance";
      document.getElementById("action-btn").classList.remove("checkout");
      CHECK_STATUS = "none";
    }

    let _statusDebounce = null;
    async function onEmployeeIdInput() {
      const val = document.getElementById("employee-id").value.trim();
      clearTimeout(_statusDebounce);
      if (val.length < 2) {
        // Reset to neutral if input cleared
        document.getElementById("page-title").textContent = "Mark Attendance";
        document.getElementById("page-subtitle").textContent = "Enter your Employee ID";
        document.getElementById("action-btn").textContent = "Mark Attendance";
        document.getElementById("action-btn").classList.remove("checkout");
        CHECK_STATUS = "none";
        return;
      }
      _statusDebounce = setTimeout(async () => {
        try {
          const res = await fetch(
            `/api/v1/checkin/status?employee_id=${encodeURIComponent(val)}&session_id=${encodeURIComponent(SESSION_ID)}`
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data.found) {
            applyCheckStatus(data.check_status, data.employee);
            // Show their name as a hint under the input
            document.getElementById("page-subtitle").textContent =
              data.check_status === "checked_in"
                ? `${data.employee} — ready to clock out`
                : `${data.employee} — ready to clock in`;
          }
        } catch (e) { /* silent — server is optional hint only */ }
      }, 400);
    }

    async function submitScan() {
      const btn = document.getElementById("action-btn");
      const errorMsg = document.getElementById("error-msg");

      // Get employee ID — from known binding or input
      let employeeId = null;
      if (!IS_KNOWN ||
          document.getElementById("id-section").style.display !== "none") {
        employeeId = document.getElementById("employee-id").value.trim();
        if (!employeeId) {
          showError("Please enter your Employee ID");
          return;
        }
      } else {
        employeeId = KNOWN_ID;
      }

      btn.disabled = true;
      btn.textContent = "Processing...";
      errorMsg.style.display = "none";

      try {
        const payload = {
          qr_token: QR_TOKEN,
          employee_id: employeeId,
          fingerprint: getFingerprint(),
        };

        // Use absolute path for robustness
        const apiURL = window.location.origin + "/api/v1/checkin/";
        const res = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          console.error("Non-JSON response received");
        }

        if (res.ok) {
          const params = new URLSearchParams({
            name: data.employee || "",
            status: data.status || "",
            action: data.action || "",
            session: data.session || "",
            hours: data.hours_clocked || "",
          });
          window.location.href = `/checkin/success?${params}`;
        } else {
          const errorDetail = data.detail || "Server error (" + res.status + ")";
          showError(errorDetail);
          btn.disabled = false;
          btn.textContent = CHECK_STATUS === "checked_in" ? "Clock Out" : "Clock In";
        }
      } catch (err) {
        showError("Network error. Please try again.");
        btn.disabled = false;
        btn.textContent = CHECK_STATUS === "checked_in" ? "Clock Out" : "Clock In";
      }
    }

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
    }

    document.getElementById("employee-id")
      ?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitScan();
      });

    initPage();
    tryResolveFingerprint();
  </script>
</body>
</html>
