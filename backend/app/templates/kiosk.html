<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ratel · Attendance Kiosk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-1: #f7fbff;
      --bg-2: #edf5ff;
      --bg-3: #e3eeff;
      --panel: rgba(255,255,255,0.92);
      --panel-strong: #ffffff;
      --border: rgba(15,79,157,0.14);
      --text: #0e2c52;
      --muted: #5d7ca2;
      --soft: #7d98b8;
      --primary: #0f4f9d;
      --accent: #2f7de1;
      --success: #1f9d68;
      --success-soft: rgba(31,157,104,0.12);
      --warning: #d9901a;
      --warning-soft: rgba(217,144,26,0.14);
      --shadow: 0 28px 60px rgba(12,54,110,0.14);
    }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2), var(--bg-3));
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      user-select: none;
    }

    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 999px;
      padding: 14px 22px 14px 26px;
      margin-bottom: 16px;
      box-shadow: 0 18px 36px rgba(15,79,157,0.22);
    }

    h1 {
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px; margin-bottom: 40px;
      text-align: center;
    }

    .session-badge {
      display: flex; align-items: center; gap: 10px;
      background: var(--success-soft);
      border: 1px solid rgba(31,157,104,0.2);
      border-radius: 999px; padding: 10px 20px;
      margin-bottom: 32px;
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .session-name {
      color: var(--success); font-size: 15px; font-weight: 700;
    }

    .qr-wrapper {
      background: white;
      padding: 20px; border-radius: 24px;
      box-shadow: 0 20px 60px rgba(12,54,110,0.16);
      margin-bottom: 28px;
    }

    .timer-section {
      width: 300px; text-align: center; margin-bottom: 40px;
    }

    .timer-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }

    .timer-label { color: var(--muted); font-size: 12px; }
    .timer-value { font-size: 13px; font-weight: 700; }

    .progress-bar {
      width: 100%; height: 4px;
      background: rgba(15,79,157,0.08);
      border-radius: 999px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; border-radius: 999px;
      transition: width 1s linear, background 0.3s;
    }

    .attendee-section {
      width: 100%; max-width: 400px;
    }

    .attendee-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }

    .attendee-title {
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
    }

    .attendee-count {
      background: var(--success-soft);
      border: 1px solid rgba(31,157,104,0.2);
      color: var(--success); border-radius: 999px;
      padding: 3px 12px; font-size: 13px; font-weight: 700;
    }

    .attendee-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 200px; overflow: hidden;
    }

    .attendee-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
      animation: slideIn 0.3s ease;
      box-shadow: 0 12px 28px rgba(12,54,110,0.08);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .attendee-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
      color: white;
    }

    .attendee-name { font-size: 14px; font-weight: 600; flex: 1; }

    .attendee-status {
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .status-present {
      background: var(--success-soft);
      border: 1px solid rgba(31,157,104,0.2);
      color: var(--success);
    }

    .status-late {
      background: var(--warning-soft);
      border: 1px solid rgba(217,144,26,0.2);
      color: var(--warning);
    }

    .no-session {
      text-align: center; padding: 40px;
      color: var(--muted); font-size: 15px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      min-width: min(420px, 100%);
    }

    #qrcode canvas, #qrcode img {
      display: block;
    }
  </style>
</head>
<body>
  <div class="logo">RATEL</div>
  <h1>Ratel Attendance</h1>
  <p class="subtitle" id="subtitle">Scan QR code with your phone to check in</p>

  <div id="active-session" style="display:none; flex-direction:column; align-items:center; width:100%; max-width:400px;">
    <div class="session-badge">
      <div class="dot"></div>
      <span class="session-name" id="session-name">Loading...</span>
    </div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="timer-section">
      <div class="timer-row">
        <span class="timer-label">QR refreshes in</span>
        <span class="timer-value" id="timer-value" style="color:#22c55e">25s</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"
          style="width:100%; background:#22c55e"></div>
      </div>
    </div>

    <div class="attendee-section">
      <div class="attendee-header">
        <span class="attendee-title">Checked In</span>
        <span class="attendee-count" id="attendee-count">0</span>
      </div>
      <div class="attendee-list" id="attendee-list"></div>
    </div>
  </div>

  <div id="no-session" class="no-session">
    <div style="font-size:48px; margin-bottom:16px">⏳</div>
    <p>No active session</p>
    <p style="font-size:13px; margin-top:8px">Ask your admin to start an attendance session</p>
  </div>

  <script>
    const API_BASE = window.location.origin + "/api/v1";
    const TOKEN_TTL = 25;
    const ACTIVE_SESSION_POLL_MS = 5000;

    let sessionId = null;
    let sessionName = null;
    let qrToken = null;
    let adminToken = null;
    let timeLeft = TOKEN_TTL;
    let qrCode = null;
    let ws = null;
    let attendees = [];
    let countdownInterval = null;
    let activeSessionPollInterval = null;
    let reconnectTimeout = null;
    let shouldReconnect = false;

    // ── Auth ──────────────────────────────────────────────────────────────
    async function authenticate() {
      const email = prompt("Admin email:");
      const password = prompt("Admin password:");
      if (!email || !password) return authenticate();

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        adminToken = data.access_token;
        localStorage.setItem("kiosk_token", adminToken);
        await syncActiveSession();
        startActiveSessionPolling();
      } catch (err) {
        alert("Login failed: " + err.message);
        authenticate();
      }
    }

    // ── Session ───────────────────────────────────────────────────────────
    async function fetchActiveSession() {
      const res = await fetch(`${API_BASE}/sessions/active`, {
        headers: { Authorization: `Bearer ${adminToken}` },
      });

      if (res.status === 404) {
        return null;
      }

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Failed to load active session");
      }

      return data;
    }

    async function syncActiveSession() {
      const activeSession = await fetchActiveSession();
      if (!activeSession) {
        detachSession();
        showNoActiveSession();
        return;
      }

      if (sessionId === activeSession.session_id) {
        if (!ws || ws.readyState === WebSocket.CLOSED) {
          connectWebSocket();
        }
        return;
      }

      await attachToSession(activeSession);
    }

    async function attachToSession(activeSession) {
      detachSession();
      sessionId = activeSession.session_id;
      sessionName = activeSession.name;
      attendees = [];
      await rotateToken();
      showActiveSession(sessionName);
      await loadExistingAttendance();
      connectWebSocket();
      startCountdown();
    }

    function detachSession() {
      clearCountdown();
      shouldReconnect = false;
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      attendees = [];
      sessionId = null;
      sessionName = null;
      qrToken = null;
      const qrContainer = document.getElementById("qrcode");
      if (qrContainer) qrContainer.innerHTML = "";
    }

    function startActiveSessionPolling() {
      if (activeSessionPollInterval) {
        clearInterval(activeSessionPollInterval);
      }
      activeSessionPollInterval = setInterval(() => {
        void syncActiveSession();
      }, ACTIVE_SESSION_POLL_MS);
    }

    // ── QR ────────────────────────────────────────────────────────────────
    async function rotateToken() {
      if (!sessionId) return;
      const res = await fetch(`${API_BASE}/sessions/rotate-token`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${adminToken}`,
        },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Failed to rotate QR token");
      }
      qrToken = data.qr_token;
      renderQR();
    }

    async function loadExistingAttendance() {
      if (!sessionId) return;
      const res = await fetch(`${API_BASE}/checkin/session/${sessionId}`, {
        headers: { Authorization: `Bearer ${adminToken}` },
      });
      if (!res.ok) return;
      const data = await res.json();
      attendees = (data.records || []).map((record) => ({
        employee: record.employee,
        employee_id: record.employee_id,
        status: record.status,
        action: record.check_status === "checked_out" ? "checked_out" : "checked_in",
        checked_in_at: record.checked_in_at,
      }));
      renderAttendees();
    }

    function renderQR() {
      if (!qrToken) return;
      // Use raw encrypted token only — blocks generic QR scanners from opening URLs
      const container = document.getElementById("qrcode");
      container.innerHTML = "";
      qrCode = new QRCode(container, {
        text: qrToken,
        width: 240, height: 240,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H,
      });
    }

    // ── Countdown ─────────────────────────────────────────────────────────
    function startCountdown() {
      clearCountdown();
      timeLeft = TOKEN_TTL;
      updateTimerUI();
      countdownInterval = setInterval(async () => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          timeLeft = TOKEN_TTL;
          try {
            await rotateToken();
          } catch (err) {
            console.error("Failed to rotate kiosk token:", err);
          }
        }
      }, 1000);
    }

    function clearCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    function updateTimerUI() {
      const pct = (timeLeft / TOKEN_TTL) * 100;
      const color = timeLeft > 10 ? "#22c55e"
        : timeLeft > 5 ? "#f59e0b" : "#e94560";
      document.getElementById("timer-value").textContent = timeLeft + "s";
      document.getElementById("timer-value").style.color = color;
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-fill").style.background = color;
    }

    // ── WebSocket ─────────────────────────────────────────────────────────
    function connectWebSocket() {
      if (!sessionId) return;
      shouldReconnect = true;
      const wsUrl = window.location.origin.replace("https://", "wss://")
        .replace("http://", "ws://");
      ws = new WebSocket(
        `${wsUrl}/ws/sessions/${sessionId}?token=${adminToken}`
      );
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "checkin") addAttendee(data);
      };
      ws.onclose = () => {
        ws = null;
        if (!shouldReconnect || !sessionId) return;
        reconnectTimeout = setTimeout(() => {
          connectWebSocket();
        }, 3000);
      };
    }

    // ── Attendees ─────────────────────────────────────────────────────────
    function addAttendee(data) {
      attendees = attendees.filter((item) => !(
        item.employee_id === data.employee_id &&
        item.action === data.action &&
        item.checked_in_at === data.checked_in_at
      ));
      attendees.unshift(data);
      renderAttendees();
    }

    function renderAttendees() {
      const list = document.getElementById("attendee-list");
      document.getElementById("attendee-count").textContent = attendees.length;
      list.innerHTML = attendees.slice(0, 5).map((a) => `
        <div class="attendee-item">
          <div class="attendee-avatar">${a.employee.charAt(0).toUpperCase()}</div>
          <span class="attendee-name">${a.employee}</span>
          <span class="attendee-status status-${a.status}">${a.action === "checked_out" ? "out" : a.status}</span>
        </div>
      `).join("");
    }

    // ── UI Helpers ────────────────────────────────────────────────────────
    function showActiveSession(name) {
      document.getElementById("active-session").style.display = "flex";
      document.getElementById("no-session").style.display = "none";
      document.getElementById("session-name").textContent = name;
      document.getElementById("attendee-count").textContent = attendees.length;
      document.getElementById("subtitle").textContent =
        "Scan QR code with your phone to check in";
    }

    function showNoActiveSession() {
      document.getElementById("attendee-list").innerHTML = "";
      document.getElementById("attendee-count").textContent = "0";
      document.getElementById("active-session").style.display = "none";
      document.getElementById("no-session").style.display = "block";
      document.getElementById("subtitle").textContent =
        "Scan QR code with your phone to check in";
    }

    // ── Init ──────────────────────────────────────────────────────────────
    async function init() {
      // Try saved token first
      const saved = localStorage.getItem("kiosk_token");
      if (saved) {
        adminToken = saved;
        try {
          await syncActiveSession();
          startActiveSessionPolling();
          return;
        } catch (e) {
          localStorage.removeItem("kiosk_token");
        }
      }
      authenticate();
    }

    init();
  </script>
</body>
</html>
