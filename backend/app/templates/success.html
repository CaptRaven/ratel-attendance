<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ratel · {{ "Checked Out" if action == "checked_out" else "Checked In" }}!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-1: #f7fbff;
      --bg-2: #edf5ff;
      --bg-3: #e3eeff;
      --panel: rgba(255,255,255,0.92);
      --border: rgba(15,79,157,0.14);
      --text: #0e2c52;
      --muted: #5d7ca2;
      --soft: #7d98b8;
      --primary: #0f4f9d;
      --accent: #2f7de1;
      --success: #1f9d68;
      --success-soft: rgba(31,157,104,0.12);
      --warning: #d9901a;
      --warning-soft: rgba(217,144,26,0.14);
      --shadow: 0 28px 60px rgba(12,54,110,0.14);
    }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2), var(--bg-3));
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; color: var(--text);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px; padding: 48px 32px;
      width: 100%; max-width: 400px; text-align: center;
      box-shadow: var(--shadow);
    }
    .icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 36px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .icon-checkin {
      background: var(--success-soft);
      border: 2px solid rgba(31,157,104,0.24);
    }
    .icon-checkout {
      background: var(--warning-soft);
      border: 2px solid rgba(217,144,26,0.24);
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
    .name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .checkin-color { color: var(--success); }
    .checkout-color { color: var(--warning); }
    .session { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .badge {
      display: inline-block; padding: 8px 20px;
      border-radius: 999px; font-size: 13px;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 20px;
    }
    .badge-present {
      background: var(--success-soft);
      border: 1px solid rgba(31,157,104,0.24); color: var(--success);
    }
    .badge-late {
      background: var(--warning-soft);
      border: 1px solid rgba(217,144,26,0.24); color: var(--warning);
    }
    .hours-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
      margin-bottom: 20px;
    }
    .hours-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .hours-value { font-size: 28px; font-weight: 800; color: var(--warning); }
    .time { color: var(--soft); font-size: 13px; }
  </style>
</head>
<body>
  <div class="card" id="success-card">
    {% if action == "checked_out" %}
      <div class="icon icon-checkout">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--warning)">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <h1>Clocked Out!</h1>
      <p class="name checkout-color">{{ name }}</p>
      <p class="session">{{ session }}</p>
      {% if hours %}
      <div class="hours-card">
        <div class="hours-label">Hours Clocked Today</div>
        <div class="hours-value">{{ hours }}h</div>
      </div>
      {% endif %}
    {% else %}
      <div class="icon icon-checkin">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success)">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1>Checked In!</h1>
      <p class="name checkin-color">{{ name }}</p>
      <p class="session">{{ session }}</p>
      <div class="badge badge-{{ status.lower() if status else 'present' }}">
        {{ status if status else 'PRESENT' }}
      </div>
    {% endif %}
    <p class="time" id="recorded-time">Recorded at <span class="time-value"></span></p>
  </div>
  <script>
    // Format the UTC time in the user's local time zone
    const timeUtc = "{{ time_utc }}";
    const date = new Date(timeUtc);
    const formattedTime = date.toLocaleString("en-GB", {
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
      month: "short",
      day: "numeric",
      year: "numeric"
    }).replace(",", " ·");
    document.querySelector(".time-value").textContent = formattedTime;
  </script>
</body>
</html>
