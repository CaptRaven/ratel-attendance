<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Ratel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --text: #0f172a;
      --text-soft: #475569;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error: #dc2626;
      --radius: 14px;
    }
    body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 40px 36px; width: 100%; max-width: 400px; }
    .logo { display: flex; justify-content: center; margin-bottom: 28px; }
    .logo img { height: 56px; object-fit: contain; }
    h1 { font-size: 22px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 6px; }
    p.sub { text-align: center; color: var(--text-soft); font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-soft); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; color: var(--text); outline: none; transition: border-color .2s; margin-bottom: 18px; }
    input:focus { border-color: var(--primary); }
    .error { background: var(--error-bg); color: var(--error); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 18px; display: none; }
    button { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { text-align: center; font-size: 12px; color: var(--text-soft); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/ratel-logo.png" alt="Ratel" /></div>
    <h1>Staff Portal</h1>
    <p class="sub">Sign in with your Employee ID and PIN</p>

    <div class="error" id="error-msg"></div>

    <label for="emp-id">Employee ID</label>
    <input type="text" id="emp-id" placeholder="e.g. EMP-001" autocomplete="username" autocapitalize="characters" />

    <label for="pin">PIN</label>
    <input type="password" id="pin" placeholder="Enter your PIN" autocomplete="current-password" inputmode="numeric" maxlength="20" />

    <button id="login-btn" onclick="doLogin()">Sign In</button>
    <p class="hint">Default PIN is <strong>1234</strong> — change it after first login</p>
  </div>

  <script>
    document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    document.getElementById("emp-id").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("pin").focus(); });

    async function doLogin() {
      const btn = document.getElementById("login-btn");
      const err = document.getElementById("error-msg");
      const empId = document.getElementById("emp-id").value.trim().toUpperCase().replace(/\s+/g, "-");
      const pin   = document.getElementById("pin").value;

      if (!empId) { showErr("Please enter your Employee ID."); return; }
      if (!pin)   { showErr("Please enter your PIN."); return; }

      btn.disabled = true; btn.textContent = "Signing in…";
      err.style.display = "none";

      try {
        const res = await fetch("/api/v1/staff/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ employee_id: empId, pin }),
        });
        const data = await res.json();
        if (!res.ok) { showErr(data.detail || "Login failed."); return; }
        window.location.href = "/staff";
      } catch (e) {
        showErr("Network error — please try again.");
      } finally {
        btn.disabled = false; btn.textContent = "Sign In";
      }
    }

    function showErr(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg; el.style.display = "block";
    }
  </script>
</body>
</html>
